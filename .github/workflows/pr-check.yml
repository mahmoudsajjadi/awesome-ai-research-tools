name: PR Automated Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-pr:
    name: Lint Markdown & PR Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run markdownlint
        run: |
          npx markdownlint-cli "README.md" --disable MD013 MD024 MD033 MD041 || true

      - name: Check Modified Links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        continue-on-error: true
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'yes'
          config-file: '.github/mlc_config.json'

  pr-welcome:
    name: Contributor Guidance
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `### Thank you for contributing to Awesome AI Research Tools! 🔬
            
            Our automated CI workflow has queued checks for this pull request:
            - [x] Syntax & Markdown formatting
            - [x] Link validity & HTTPS verification
            
            **Quick PR Checklist:**
            1. Ensure new entries follow the format: \`- [Name](url) — Concise 1-2 sentence description.\`
            2. Verify entries are alphabetically ordered in their respective category.
            3. Check that open-source code/paper links (arXiv/GitHub/Zenodo) are provided where applicable.
            
            A maintainer will review your contribution shortly!`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
